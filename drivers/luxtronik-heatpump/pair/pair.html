<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Luxtronik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7fafc;
      color: #2d3748;
      padding: 28px 24px 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .header img { width: 48px; height: 48px; border-radius: 10px; }
    .header h1 { font-size: 17px; font-weight: 700; color: #1a202c; }
    .header p  { font-size: 12px; color: #718096; margin-top: 2px; }

    .info-box {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 12px;
      color: #2b6cb0;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
      color: #2d3748;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66,153,225,0.15);
    }
    .hint { font-size: 11px; color: #a0aec0; margin-top: 4px; }
    .error-msg {
      display: none;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 12px;
      color: #c53030;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .error-msg.visible { display: block; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 6px;
    }
    .btn:hover { background: #2c5282; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    /* Die Suche ist der angebotene Weg, das Verbinden bleibt die Bestätigung —
       deshalb hier zurückhaltender als der Hauptknopf. */
    .btn-search {
      background: #fff;
      color: #2b6cb0;
      border: 1px solid #bee3f8;
      margin-bottom: 4px;
    }
    .btn-search:hover { background: #ebf8ff; }
    .found-list { margin: 8px 0 14px; }
    .found-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .found-item:hover { border-color: #2b6cb0; background: #f7fafc; }
    .found-item.selected { border-color: #2b6cb0; background: #ebf8ff; }
    .found-addr { font-weight: 600; color: #2d3748; }
    .found-tag {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .tag-confirmed { background: #c6f6d5; color: #22543d; }
    .tag-candidate { background: #fefcbf; color: #744210; }
    .found-empty { font-size: 12px; color: #718096; padding: 6px 2px; }
    .status {
      text-align: center;
      font-size: 12px;
      color: #718096;
      margin-top: 10px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="/app/com.luxtronik.heatpump/drivers/luxtronik-heatpump/assets/images/logo.png"
         alt="" onerror="this.style.display='none'">
    <div>
      <h1>Luxtronik Heat Pump</h1>
      <p>Connect to the controller</p>
    </div>
  </div>

  <div class="info-box">
    ℹ️ The Luxtronik controller must be reachable on your local network.<br>
    Search for it below, or enter its address by hand.
  </div>

  <button class="btn btn-search" id="btn-search" onclick="searchNetwork()">
    🔍 Search network
  </button>
  <div class="found-list" id="found-list"></div>

  <div class="form-group">
    <label for="ip">IP Address</label>
    <input type="text" id="ip" placeholder="192.168.1.100"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <p class="hint">The local IP address of the Luxtronik controller.</p>
  </div>

  <div class="form-group">
    <label for="port">Port</label>
    <input type="number" id="port" value="8889" min="1" max="65535" step="1">
    <p class="hint">Default port: 8889. Only change if necessary.</p>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <button class="btn" id="btn-connect" onclick="connect()">
    Connect &amp; add
  </button>
  <div class="status" id="status"></div>

  <script>
    // Store Homey globally so onclick can reach it
    var Homey;

    function onHomeyReady(HomeyInstance) {
      Homey = HomeyInstance;
      Homey.ready();
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function showError(msg) {
      var el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('error-msg').classList.remove('visible');
    }

    function setLoading(loading) {
      var btn = document.getElementById('btn-connect');
      btn.disabled = loading;
      btn.textContent = loading ? 'Connecting…' : 'Connect & add';
      setStatus(loading ? 'Testing connection…' : '');
    }

    // MAC der ausgewählten Fundstelle. Wird beim Verbinden mitgegeben, damit das
    // Gerät seine Adresse später selbst nachführen kann.
    var selectedMac = null;

    function searchNetwork() {
      var btn  = document.getElementById('btn-search');
      var list = document.getElementById('found-list');
      hideError();
      btn.disabled = true;
      btn.textContent = 'Searching…';
      list.innerHTML = '';
      setStatus('Looking for controllers on your network…');

      var count = null;
      Homey.emit('discover')
        .then(function (found) {
          count = (found || []).length;
          renderFound(found || []);
        })
        .catch(function (err) {
          showError('Search failed: ' + (err && err.message ? err.message : err));
        })
        .then(function () {
          btn.disabled = false;
          btn.textContent = '🔍 Search network';
          // Rückmeldung stehen lassen: eine kommentarlos erscheinende Liste
          // lässt offen, ob die Suche überhaupt gelaufen ist — besonders beim
          // zweiten Versuch.
          if (count === null) setStatus('');
          else if (count === 0) setStatus('Search finished — nothing found.');
          else setStatus(count === 1 ? '1 controller found.' : count + ' controllers found.');
        });
    }

    function renderFound(found) {
      var list = document.getElementById('found-list');
      list.innerHTML = '';

      if (!found.length) {
        var empty = document.createElement('div');
        empty.className = 'found-empty';
        empty.textContent = 'Nothing found. Enter the IP address below — some controllers do not answer a search.';
        list.appendChild(empty);
        return;
      }

      // Bestätigte zuerst: auf die hat wirklich eine Luxtronik geantwortet.
      found.sort(function (a, b) { return (b.confirmed ? 1 : 0) - (a.confirmed ? 1 : 0); });

      found.forEach(function (dev) {
        var item = document.createElement('button');
        item.className = 'found-item';
        item.type = 'button';
        // Adresse am Element hinterlegen: der sichtbare Text trägt zusätzlich
        // den Port und taugt deshalb nicht zum Vergleich.
        item.setAttribute('data-address', dev.address);

        var addr = document.createElement('span');
        addr.className = 'found-addr';
        // Port mit anzeigen: meldet ein Regler einen abweichenden, springt sonst
        // unten das Port-Feld um, ohne dass ersichtlich wäre warum.
        addr.textContent = dev.port ? (dev.address + ':' + dev.port) : dev.address;
        item.appendChild(addr);

        var tag = document.createElement('span');
        tag.className = 'found-tag ' + (dev.confirmed ? 'tag-confirmed' : 'tag-candidate');
        // Ein Kandidat stammt allein aus der MAC-Erkennung: die findet die
        // Netzwerkkarte, nicht die Wärmepumpe.
        tag.textContent = dev.confirmed ? 'Luxtronik' : 'possible';
        item.appendChild(tag);

        item.onclick = function () { selectFound(dev, item); };
        list.appendChild(item);
      });
    }

    function selectFound(dev, item) {
      document.querySelectorAll('.found-item').forEach(function (el) {
        el.classList.remove('selected');
      });
      item.classList.add('selected');
      document.getElementById('ip').value = dev.address;
      if (dev.port) document.getElementById('port').value = dev.port;
      selectedMac = dev.mac || null;
      hideError();
    }

    function connect() {
      var ip   = document.getElementById('ip').value.trim();
      var port = parseInt(document.getElementById('port').value, 10);

      hideError();

      if (!ip || !/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)) {
        showError('Please enter a valid IP address (e.g. 192.168.1.100).');
        return;
      }
      if (!port || port < 1 || port > 65535) {
        showError('Please enter a valid port (1–65535).');
        return;
      }

      setLoading(true);

      // Die MAC nur mitgeben, wenn die Adresse noch die der Fundstelle ist —
      // tippt jemand danach eine andere ein, gehört die MAC nicht mehr dazu.
      var mac = selectedMac;
      var picked = document.querySelector('.found-item.selected');
      if (!picked || picked.getAttribute('data-address') !== ip) mac = null;

      // emit → driver.js session.setHandler('connect') → returns device object or false
      Homey.emit('connect', { ip: ip, port: port, mac: mac })
        .then(function(device) {
          if (!device) {
            setLoading(false);
            showError(
              'Connection to ' + ip + ':' + port + ' failed. ' +
              'Please check the IP address and port and make sure ' +
              'the heat pump is powered on and reachable on your network.'
            );
            return Promise.reject(null);
          }
          setStatus('Adding device…');
          // Create the device directly – no list_devices step needed
          return Homey.createDevice(device);
        })
        .then(function() {
          setStatus('Successfully added!');
          Homey.alert('Heat pump successfully added!').then(function() {
            Homey.done();
          });
        })
        .catch(function(err) {
          if (err === null) return; // connection failed, error already shown
          setLoading(false);
          showError('Fehler: ' + (err && err.message ? err.message : String(err)));
        });
    }
  </script>

</body>
</html>
